services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-africashiplog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-africashiplog}
      POSTGRES_DB: ${POSTGRES_DB:-africashiplog}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-africashiplog}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-africashiplog}:${POSTGRES_PASSWORD:-africashiplog}@db:5432/${POSTGRES_DB:-africashiplog}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  db_data:
